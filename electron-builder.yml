appId: com.ebookviewer.app
productName: Ebook Viewer
copyright: Copyright © 2026 Bright9025
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - resources/icons/icon.png
extraFiles:
  - from: resources/launcher/launch-no-sandbox.cmd
    to: 启动 Ebook Viewer.cmd
  - from: resources/launcher/EbookViewerLauncher.exe
    to: Ebook Viewer.exe
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
compression: normal
npmRebuild: false
win:
  executableName: EbookViewerCore
  icon: resources/icons/icon.ico
  target:
    - target: dir
      arch:
        - x64
  artifactName: Ebook-Viewer-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ebook Viewer
